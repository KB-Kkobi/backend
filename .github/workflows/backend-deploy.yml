name: Backend CI/CD

on:
  push:
    branches:
      - develop

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kb-kkobi/backend

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 저장소 코드를 GitHub Actions 실행 환경으로 가져온다.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Docker 이미지를 빌드할 Buildx 환경을 준비한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub가 제공하는 토큰으로 GHCR에 로그인한다.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 백엔드 이미지를 생성하고 GHCR에 업로드한다.
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      packages: read

    steps:
      # EC2로 전송할 compose 파일을 가져온다.
      - name: Checkout repository
        uses: actions/checkout@v6

      # GitHub Secret에 저장한 개인 키로 SSH 접속 환경을 구성한다.
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 저장소의 최신 Compose 파일을 EC2 임시 경로로 전송한다.
      - name: Copy Docker Compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          scp compose.ec2.yaml \
            "$EC2_USERNAME@$EC2_HOST:/tmp/compose.ec2.yaml"

      # 최신 이미지를 내려받고 백엔드 컨테이너만 교체한다.
      - name: Deploy backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$EC2_USERNAME@$EC2_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          sudo install -m 644 \
            /tmp/compose.ec2.yaml \
            /opt/kkobi/compose.ec2.yaml

          rm -f /tmp/compose.ec2.yaml

          cd /opt/kkobi

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          docker compose -f compose.ec2.yaml pull backend

          docker compose -f compose.ec2.yaml \
            up -d --no-deps backend

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Waiting for backend... ($attempt/30)"
            sleep 5
          done

          echo "Backend health check failed."
          docker compose -f compose.ec2.yaml \
            logs --tail=100 backend

          exit 1
          REMOTE_SCRIPT