name: Backend CI/CD

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      run_flyway_repair:
        description: "flyway repair를 먼저 실행할지 여부 (평소엔 false로 두세요. repair는 실제 SQL을 재실행하지 않고 체크섬/이력만 맞추므로, 이미 적용된 마이그레이션 파일을 수정한 뒤 그 변경을 '반영된 것으로 간주'하고 싶을 때만 사람이 의도적으로 켜야 합니다)"
        required: false
        default: "false"
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kb-kkobi/backend

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # GitHub Actions 실행 환경에 백엔드 코드를 내려받는다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Docker 이미지를 빌드할 Buildx 환경을 준비한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub가 제공하는 토큰으로 GHCR에 로그인한다.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 백엔드 Docker 이미지를 생성하고 GHCR에 업로드한다.
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    # 최초 GHCR 이미지 준비 전에는 배포 작업을 건너뛴다.
    if: vars.ENABLE_EC2_DEPLOY == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      # EC2에 전달할 Compose 파일과 마이그레이션 파일을 내려받는다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # GitHub OIDC 토큰으로 AWS IAM 역할을 임시로 맡는다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # AWS SSM을 통해 EC2 내부에서 배포 명령을 실행한다.
      - name: Deploy backend through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUN_FLYWAY_REPAIR: ${{ github.event.inputs.run_flyway_repair || 'false' }}
        run: |
          set -euo pipefail

          # Compose 파일을 한 줄 문자열로 변환한다.
          COMPOSE_BASE64="$(base64 -w 0 compose.ec2.yaml)"

          # Flyway 마이그레이션 파일을 압축한 뒤 한 줄 문자열로 변환한다.
          tar -czf migration.tar.gz -C src/main/resources/db migration
          MIGRATION_BASE64="$(base64 -w 0 migration.tar.gz)"

          # EC2 내부에서 실행할 명령 목록을 만든다.
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -eu",

              "echo 'Updating Compose configuration...'",
              "printf '%s' '$COMPOSE_BASE64' | base64 -d > /opt/kkobi/compose.ec2.yaml",

              "echo 'Updating Flyway migration files...'",
              "rm -rf /tmp/kkobi-migration",
              "mkdir -p /tmp/kkobi-migration",
              "printf '%s' '$MIGRATION_BASE64' | base64 -d > /tmp/kkobi-migration/migration.tar.gz",
              "tar -xzf /tmp/kkobi-migration/migration.tar.gz -C /tmp/kkobi-migration",
              "mkdir -p /opt/kkobi/migration",
              "cp -f /tmp/kkobi-migration/migration/*.sql /opt/kkobi/migration/",
              "rm -rf /tmp/kkobi-migration",

              "cd /opt/kkobi",

              "echo 'Pulling deployment images...'",
              "docker compose -f compose.ec2.yaml pull flyway backend",

              "if [ '$RUN_FLYWAY_REPAIR' = 'true' ]; then echo 'Repairing Flyway schema history (manually requested)...'; docker compose -f compose.ec2.yaml run --rm flyway-repair; else echo 'Skipping flyway repair (default). repair only realigns checksums/history without re-running SQL, so it must never run unconditionally before migrate - trigger it manually via workflow_dispatch when truly needed.'; fi",

              "echo 'Running Flyway migrations...'",

              "docker compose -f compose.ec2.yaml run --rm flyway",

              "echo 'Deploying backend...'",
              "docker compose -f compose.ec2.yaml up -d --no-deps backend",

              "echo 'Checking backend health...'",
              "for attempt in \$(seq 1 30); do if curl -fsS http://127.0.0.1:8080/api/health; then echo; echo 'Backend health check passed.'; exit 0; fi; echo \"Waiting for backend... (\$attempt/30)\"; sleep 5; done",

              "echo 'Backend health check failed.'",
              "docker compose -f compose.ec2.yaml logs --tail=100 backend",
              "exit 1"
            ]
          }
          EOF

          # 꼬비 EC2에 SSM 명령을 전달하고 명령 ID를 받는다.
          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Kkobi backend ${GITHUB_SHA}" \
              --parameters file://ssm-parameters.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          # 배포 명령이 끝날 때까지 상태를 반복 확인한다.
          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            echo "SSM command status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{
                    Status: Status,
                    Output: StandardOutputContent,
                    Error: StandardErrorContent
                  }" \
                  --output json

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{
                    Status: Status,
                    Output: StandardOutputContent,
                    Error: StandardErrorContent
                  }" \
                  --output json

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac
          done

          echo "SSM command result timed out."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json || true

          exit 1