services:
  mysql:
    image: mysql:8.0.46
    container_name: kkobi-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"


    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10


  flyway:
    image: flyway/flyway:12.10.0
    container_name: kkobi-flyway

    command:
      - "-url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      - "-user=${MYSQL_USER}"
      - "-password=${MYSQL_PASSWORD}"
      - "-connectRetries=60"
      # 27~29는 이 저장소 밖에서 같은 DB에 직접 적용되고 있는 별도 마이그레이션(정체 확인 중).
      # 우리 쪽 파일이 아니라 로컬에 없는 게 정상이라 이 세 버전만 콕 집어 무시한다.
      # 새 버전이 또 추가되면 여기 목록도 늘려줘야 하며, 그 자체가 외부 변경 감지 신호가 된다.
      - "-ignoreMigrationPatterns=27:missing,28:missing,29:missing"
      - "migrate"

    volumes:
      - ./migration:/flyway/sql:ro

    depends_on:
      mysql:
        condition: service_healthy

  flyway-repair:
    image: flyway/flyway:12.10.0

    command:
      - "-url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      - "-user=${MYSQL_USER}"
      - "-password=${MYSQL_PASSWORD}"
      - "-connectRetries=60"
      - "repair"

    volumes:
      - ./migration:/flyway/sql:ro

    depends_on:
      mysql:
        condition: service_healthy


  redis:
    image: redis:7
    container_name: kkobi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    image: ghcr.io/kb-kkobi/backend:latest
    container_name: kkobi-backend
    restart: unless-stopped

    environment:
      JDBC_URL: jdbc:log4jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&sslMode=DISABLED
      JDBC_USERNAME: ${MYSQL_USER}
      JDBC_PASSWORD: ${MYSQL_PASSWORD}
      FINLIFE_API_KEY: ${FINLIFE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-true}
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-Strict}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      flyway:
        condition: service_completed_successfully


  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: kkobi-datadog-agent
    restart: unless-stopped
    pid: host
    # 인스턴스 메모리가 매우 빠듯해서(여유 <150MB) 컨테이너 자체에 상한을 걸어둔다.
    # 한도를 넘으면 이 컨테이너만 재시작되고, 호스트 전체 OOM으로 다른 서비스가 죽는 걸 막는다.
    mem_limit: 150m
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ap1.datadoghq.com
      DD_HOSTNAME: kkobi-ec2
      # 리소스 여유가 없어 우선 컨테이너/호스트 지표만 수집하고, 무거운 기능은 꺼둔다.
      DD_APM_ENABLED: "false"
      DD_LOGS_ENABLED: "false"
      DD_PROCESS_AGENT_ENABLED: "false"
      DD_ENABLE_METADATA_COLLECTION: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro


volumes:
  mysql-data:
  redis-data:
