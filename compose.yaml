services:
  mysql:
    image: mysql:8.0.46
    container_name: kkobi-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    command: --innodb-buffer-pool-size=1073741824

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10


  flyway:
    image: flyway/flyway:12.10.0
    container_name: kkobi-flyway

    command:
      - "-url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      - "-user=${MYSQL_USER}"
      - "-password=${MYSQL_PASSWORD}"
      - "-connectRetries=60"
      - "migrate"

    volumes:
      - ./src/main/resources/db/migration:/flyway/sql

    depends_on:
      mysql:
        condition: service_healthy

  flyway-repair:
    image: flyway/flyway:12.10.0

    command:
      - "-url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      - "-user=${MYSQL_USER}"
      - "-password=${MYSQL_PASSWORD}"
      - "-connectRetries=60"
      - "repair"

    volumes:
      - ./src/main/resources/db/migration:/flyway/sql

    depends_on:
      mysql:
        condition: service_healthy


  redis:
    image: redis:7
    container_name: kkobi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: kkobi-backend
    container_name: kkobi-backend
    restart: unless-stopped

    environment:
      JDBC_URL: jdbc:log4jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&sslMode=DISABLED
      JDBC_USERNAME: ${MYSQL_USER}
      JDBC_PASSWORD: ${MYSQL_PASSWORD}
      FINLIFE_API_KEY: ${FINLIFE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-false}
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-Strict}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      flyway:
        condition: service_completed_successfully


volumes:
  mysql-data:
  redis-data:
